<!doctype html>
<html lang="en">
<head>

  <title>404 — Page Not Found | Lume Systems</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030712;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;

      align-items: center;

    .code { font-size: 6rem; font-weight: 900; letter-spacing: -0.05em; color: #f59e0b; line-height: 1; }

    p { color: #64748b; font-size: 1rem; max-width: 28rem; line-height: 1.6; }

      display: inline-flex; align-items: center; gap: 0.5rem;
      margin-top: 2.5rem; padding: 0.75rem 1.75rem;
      background: #f59e0b; color: #030712; border-radius: 0.75rem;
      font-weight: 700; font-size: 0.875rem; text-decoration: none;
      transition: background 0.2s;
    }

</head>
